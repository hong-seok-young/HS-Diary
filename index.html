<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light only">
  <meta name="theme-color" content="#fdf3dc">
  <title>석영이와 예은이</title>
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="석영이와 예은이">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preload" href="fonts/neodgm.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="hero">
    <div class="hero-inner box">
      <div class="scene-wrap">
        <div class="scene" id="scene">
          <span class="sc-sun tap" data-sprite="sun" data-scale="3"></span>
          <span class="sc-moon tap" data-sprite="moon" data-scale="3"></span>
          <span class="sc-star s1" data-sprite="twinkle" data-scale="2"></span>
          <span class="sc-star s2" data-sprite="twinkle" data-scale="2"></span>
          <span class="sc-star s3" data-sprite="twinkle" data-scale="2"></span>
          <span class="sc-star s4" data-sprite="twinkle" data-scale="2"></span>
          <span class="sc-star s5" data-sprite="twinkle" data-scale="2"></span>
          <span class="sc-cloud c1 tap" data-sprite="cloud" data-scale="3"></span>
          <span class="sc-cloud c2 tap" data-sprite="cloudSmall" data-scale="3"></span>
          <span class="sc-cloud c3 tap" data-sprite="cloud" data-scale="2"></span>
          <div class="sc-hills" data-bg="hills" data-scale="3"></div>
          <span class="sc-tree t1 tap" data-sprite="tree" data-scale="3"></span>
          <span class="sc-tree t2 tap" data-sprite="tree" data-scale="2"></span>
          <div class="sc-ground" data-bg="ground" data-scale="3"></div>
          <span class="sc-flower f1 tap" data-sprite="flowerA" data-scale="2"></span>
          <span class="sc-flower f2 tap" data-sprite="flowerB" data-scale="2"></span>
          <span class="sc-flower f3 tap" data-sprite="flowerC" data-scale="2"></span>
          <span class="sc-flower f4 tap" data-sprite="flowerB" data-scale="2"></span>
          <span class="sc-flower f5 tap" data-sprite="flowerA" data-scale="2"></span>
          <div class="couple">
            <button class="bob" data-who="him" data-sprite="him" aria-label="석영"></button>
            <button class="bob b2" data-who="her" data-sprite="her" aria-label="예은"></button>
          </div>
        </div>
        <div class="bubble" id="bubble" role="status" hidden></div>
      </div>
      <h1 id="diaryTitle">석영이와 예은이</h1>
      <button class="dday" id="dday" aria-expanded="false" aria-controls="since">D+0</button>
      <div class="since" id="since" hidden></div>
    </div>
  </header>

  <main class="container">
    <nav class="menu" id="menu">
      <button class="menu-btn" data-panel="upcoming" aria-expanded="false"><span data-icon="calendar"></span>기념일</button>
      <button class="menu-btn" data-panel="stats" aria-expanded="false"><span data-icon="chart"></span>통계</button>
      <button class="menu-btn" data-panel="search" aria-expanded="false"><span data-icon="search"></span>찾기</button>
    </nav>

    <div class="panels" id="panels">
      <section class="panel box" id="panel-upcoming" hidden>
        <div class="upcoming-list" id="upcomingList"></div>
      </section>

      <section class="panel box" id="panel-stats" hidden>
        <div class="stats">
          <button class="stat" data-stat="all"><span class="stat-num" id="statTotal">0</span><span class="stat-label">기록</span></button>
          <button class="stat" data-stat="travel"><span class="stat-num" id="statTravel">0</span><span class="stat-label">여행</span></button>
          <button class="stat" data-stat="food"><span class="stat-num" id="statFood">0</span><span class="stat-label">맛집</span></button>
          <button class="stat" data-stat="places" aria-expanded="false"><span class="stat-num" id="statPlaces">0</span><span class="stat-label">장소</span></button>
        </div>
        <div class="places" id="places" hidden></div>
      </section>

      <section class="panel box" id="panel-search" hidden>
        <div class="search-row">
          <input type="search" id="search" placeholder="검색">
          <select id="sort">
            <option value="desc">최신순</option>
            <option value="asc">오래된순</option>
            <option value="rating">별점순</option>
          </select>
        </div>
        <div class="filters" id="filters">
          <button class="chip active" data-cat="all">전체</button>
          <button class="chip" data-cat="date"><span data-icon="date"></span>데이트</button>
          <button class="chip" data-cat="travel"><span data-icon="travel"></span>여행</button>
          <button class="chip" data-cat="food"><span data-icon="food"></span>맛집</button>
          <button class="chip" data-cat="cafe"><span data-icon="cafe"></span>카페</button>
          <button class="chip" data-cat="anniv"><span data-icon="anniv"></span>기념일</button>
          <button class="chip" data-cat="etc"><span data-icon="etc"></span>기타</button>
        </div>
      </section>
    </div>

    <div class="active-filter" id="activeFilter" hidden>
      <span id="activeFilterText"></span>
      <button class="link" id="btnClearFilter">지우기</button>
    </div>

    <section class="timeline" id="timeline"></section>

    <p class="empty" id="empty" hidden>아직 기록이 없어요</p>

    <section class="tools">
      <details class="box">
        <summary>내보내기</summary>
        <div class="tools-body">
          <div class="tools-btns">
            <button class="btn" id="btnExport">코드 복사</button>
            <button class="btn" id="btnDownload">entries.js 다운로드</button>
            <button class="btn danger" id="btnClearLocal">임시 기록 비우기</button>
          </div>
          <textarea id="exportBox" rows="8" readonly></textarea>
        </div>
      </details>
    </section>
  </main>

  <button class="fab" id="btnAdd" aria-label="기록 추가">+</button>
  <div class="toast" id="toast" role="status" hidden></div>

  <!-- 기록 추가 / 수정 모달 -->
  <div class="modal" id="modal" hidden>
    <div class="modal-card box">
      <h2 id="modalTitle">새 기록</h2>
      <form id="form">
        <input type="hidden" id="fId">
        <label>날짜 <input type="date" id="fDate" required></label>
        <label>종류
          <select id="fCat">
            <option value="date">데이트</option>
            <option value="travel">여행</option>
            <option value="food">맛집</option>
            <option value="cafe">카페</option>
            <option value="anniv">기념일</option>
            <option value="etc">기타</option>
          </select>
        </label>
        <label>제목 <input type="text" id="fTitle" required></label>
        <label>장소 <input type="text" id="fPlace"></label>
        <label>별점
          <div class="rating-input" id="fRating">
            <span data-v="1"></span><span data-v="2"></span><span data-v="3"></span><span data-v="4"></span><span data-v="5"></span>
          </div>
        </label>
        <label>메모 <textarea id="fMemo" rows="3"></textarea></label>
        <label>태그 <input type="text" id="fTags" placeholder="쉼표로 구분"></label>
        <label>사진 <input type="text" id="fPhoto" placeholder="파일명 또는 URL"></label>
        <div class="modal-btns">
          <button type="button" class="btn" id="btnCancel">취소</button>
          <button type="button" class="btn danger" id="btnDelete" hidden>삭제</button>
          <button type="submit" class="btn primary">저장</button>
        </div>
      </form>
    </div>
  </div>

  <script src="data/entries.js"></script>
  <script src="js/pixel.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
