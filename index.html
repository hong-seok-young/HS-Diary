<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light only">
  <meta name="theme-color" content="#fdf3dc">
  <title>석영이와 예은이</title>
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="석영❤️예은">
  <meta name="application-name" content="석영❤️예은">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preload" href="fonts/neodgm.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- ==================== 홈 ==================== -->
  <section class="view is-active" data-view="home">
    <header class="hero">
      <div class="hero-inner box">
        <div class="scene-wrap">
          <div class="scene" id="scene">
            <div class="sky" id="skyA"></div>
            <div class="sky" id="skyB"></div>
            <div class="sc-stars" id="stars"></div>
            <div class="sc-rainbow" id="rainbow"></div>
            <span class="sc-sun" id="sun" data-sprite="sun" data-scale="3"></span>
            <span class="sc-moon" id="moon" data-sprite="moon" data-scale="3"></span>
            <div class="sc-clouds" id="clouds"></div>
            <div class="sc-haze" id="haze"></div>
            <div class="sc-hills" data-bg="hills" data-scale="3"></div>
            <span class="sc-tree t1 tap" data-sprite="tree" data-scale="3"></span>
            <span class="sc-tree t2 tap" data-sprite="tree" data-scale="2"></span>
            <div class="sc-ground" data-bg="ground" data-scale="3"></div>
            <span class="sc-flower f1 tap" data-sprite="flowerA" data-scale="2"></span>
            <span class="sc-flower f2 tap" data-sprite="flowerB" data-scale="2"></span>
            <span class="sc-flower f3 tap" data-sprite="flowerC" data-scale="2"></span>
            <span class="sc-flower f4 tap" data-sprite="flowerB" data-scale="2"></span>
            <span class="sc-flower f5 tap" data-sprite="flowerA" data-scale="2"></span>
            <canvas class="sc-fx back" id="fxBack" aria-hidden="true"></canvas>
            <div class="sc-deco" id="deco"></div>
            <button class="sc-mailbox" id="mailbox" aria-label="우체통" hidden><i></i></button>
            <button class="sc-line" id="closet" aria-label="옷장 (빨랫줄)"></button>
            <button class="sc-kennel" id="kennel" aria-label="동물 친구들 집"><i></i></button>
            <button class="sc-plane" id="plane" aria-label="쪽지 보내기" hidden><span></span></button>
            <div class="sc-tint" id="tint"></div>
            <div class="couple" id="couple">
              <button class="bob" data-who="him" aria-label="석영"><i class="mood-tag" id="moodHim"></i><i class="prop-top" id="topHim"></i><span class="ch-wrap"><img class="px ch" alt="" draggable="false"></span></button>
              <button class="bob b2" data-who="her" aria-label="예은"><i class="mood-tag" id="moodHer"></i><i class="prop-top" id="topHer"></i><span class="ch-wrap"><img class="px ch" alt="" draggable="false"></span></button>
            </div>
            <div class="sc-props" id="props"></div>
            <canvas class="sc-fx" id="fxCanvas" aria-hidden="true"></canvas>
            <div class="sc-flash" id="flash"></div>
            <button class="weather-chip" id="weatherChip" aria-label="날씨"></button>
            <span class="phase-chip" id="phaseChip"></span>
            <button class="sc-banner" id="banner" aria-label="우리 이름표"><b id="diaryTitle">석영이와 예은이</b></button>
            <button class="sc-banner pt" id="banA" aria-label="며칠째" style="visibility:hidden"><b id="dday">D+0</b></button>
            <button class="sc-banner pt" id="banB" aria-label="기념일" style="visibility:hidden" hidden><b id="ddayB"></b></button>
            <button class="sc-banner pt" id="banS" aria-label="다가오는 일정" style="visibility:hidden" hidden><b id="banNext"></b></button>
            <i class="sync-dot" id="syncDot" hidden></i>
          </div>
          <div class="bubble" id="bubble" role="status"></div>
        </div>
      </div>
    </header>

    <main class="container home-body">
      <div class="install-bar box" id="installBar" hidden>
        <span class="install-ico" data-sprite="heartOn" data-scale="3"></span>
        <span class="install-text" id="installText">앱으로 깔면 더 편해요</span>
        <button class="btn small primary" id="btnInstall">설치</button>
      </div>

      <div class="home-cal box" id="homeCal"></div>
    </main>

    <!-- 타일을 누르면 아래에서 올라오는 창 -->
    <div class="panel-dim" id="panelDim"></div>
    <div class="panels" id="panels">
      <section class="panel" id="panel-mood"><div class="panel-box box">
        <h2>오늘의 기분</h2>
        <div class="mood-now" id="moodNow"></div>
        <div id="moodPick"></div>
      </div></section>

      <section class="panel" id="panel-mail"><div class="panel-box box">
        <h2>우체통</h2>
        <div class="mail-tabs" id="mailTabs"></div>
        <div class="mail-quest" id="mailQuest">
          <p class="quest-text" id="questText"></p>
          <i class="streak" id="streak"></i>
          <div id="questBody"></div>
        </div>
        <div class="day-list mail-list" id="mailList"></div>
        <button class="btn primary block" type="button" id="mailWrite">쪽지 쓰기</button>
      </div></section>

      <section class="panel" id="panel-note"><div class="panel-box box">
        <h2 id="noteTo">쪽지</h2>
        <form id="noteForm">
          <textarea id="noteText" rows="3" maxlength="300" placeholder="하고 싶은 말을 적어요"></textarea>
          <p class="hint" id="noteLast"></p>
          <button class="btn primary block" type="submit">종이비행기 날리기</button>
        </form>
      </div></section>

      <section class="panel" id="panel-day"><div class="panel-box box">
        <h2 class="day-title" id="dayTitle"></h2>
        <div class="day-list" id="dayList"></div>
        <button class="btn primary block" type="button" id="dayAdd">＋ 일정 적기</button>
        <form class="day-form" id="dayForm" hidden>
          <b class="df-title" id="dayFormTitle">새 일정</b>
          <input type="text" id="dayText" placeholder="무슨 일정이야?" maxlength="40" autocomplete="off">
          <div class="df-row"><label>기간</label><input type="date" id="dayFrom" aria-label="시작하는 날"><i>~</i><input type="date" id="dayTo" aria-label="끝나는 날"></div>
          <div class="df-row"><label>시간</label><span class="seg"><button type="button" data-all="1">종일</button><button type="button" data-all="0">시간 정하기</button></span></div>
          <div class="df-row" id="dayTimes"><label></label><input type="time" id="dayTime" aria-label="시작 시간"><i>~</i><input type="time" id="dayTime2" aria-label="끝나는 시간"></div>
          <div class="df-row"><label>반복</label><span class="seg"><button type="button" data-r="">한 번</button><button type="button" data-r="w">매주</button><button type="button" data-r="m">매달</button><button type="button" data-r="y">매년</button></span></div>
          <div class="df-row"><label>누구</label><span class="seg"><button type="button" data-w="me">나</button><button type="button" data-w="both">같이</button></span></div>
          <input type="text" id="dayMemo" placeholder="메모 (장소, 준비물 등)" maxlength="80" autocomplete="off">
          <div class="df-btns"><button class="btn small danger" type="button" id="dayDel" hidden>지우기</button><button class="btn small" type="button" id="dayCancel">취소</button><button class="btn small primary" type="submit">저장</button></div>
        </form>
      </div></section>

    </div>
  </section>

  <!-- ==================== 기록 ==================== -->
  <section class="view" data-view="log">
    <main class="container">
      <header class="view-head">
        <h1>기록</h1>
        <button class="btn small" id="btnSearch" aria-expanded="false"><span data-icon="search"></span>찾기</button>
      </header>
      <div class="filters scroll" id="logTabs"></div>
      <div class="fold" id="searchFold"><div class="fold-in"><div class="search-row">
        <input type="search" id="search" placeholder="검색">
        <select id="sort">
          <option value="desc">최신순</option>
          <option value="asc">오래된순</option>
          <option value="rating">하트순</option>
        </select>
      </div></div></div>
      <div class="active-filter" id="activeFilter" hidden>
        <span id="activeFilterText"></span>
        <button class="link" id="btnClearFilter">지우기</button>
      </div>
      <section class="timeline" id="timeline"></section>
      <p class="empty" id="empty" hidden>아직 기록이 없어요</p>
    </main>
  </section>

  <!-- ==================== 주말에 할 거 ==================== -->
  <section class="view" data-view="plans">
    <main class="container">
      <header class="view-head">
        <h1>주말에 할 거</h1>
      </header>
      <div class="filters scroll" id="planTabs"></div>
      <form class="quick-add" id="planForm">
        <input type="text" id="planTitle" placeholder="하고 싶은 것" maxlength="60" autocomplete="off">
        <button class="btn primary" type="submit">추가</button>
      </form>
      <div class="plan-list" id="planList"></div>
      <p class="empty" id="planEmpty" hidden>하고 싶은 걸 적어 봐요</p>
    </main>
  </section>

  <!-- ==================== 일기장 ==================== -->
  <section class="view" data-view="diary">
    <main class="container">
      <header class="view-head">
        <h1>일기장</h1>
      </header>
      <div class="post-list" id="postList"></div>
      <p class="empty" id="postEmpty" hidden>첫 일기를 써 봐요</p>
    </main>
  </section>

  <button class="fab" id="btnAdd" aria-label="추가" hidden>+</button>
  <button class="back-btn" id="backBtn" aria-label="뒤로" hidden><i></i></button>

  <nav class="nav" id="nav">
    <button class="nav-btn active" data-go="home"><span data-icon="home" data-scale="3"></span><b>홈</b></button>
    <button class="nav-btn" data-go="log"><span data-icon="pin" data-scale="3"></span><b>기록</b></button>
    <button class="nav-btn" data-go="plans"><span data-icon="todo" data-scale="3"></span><b>할 거</b></button>
    <button class="nav-btn" data-go="diary"><span data-icon="book" data-scale="3"></span><b>일기</b></button>
  </nav>

  <div class="toast" id="toast" role="status"></div>

  <!-- 기록 추가 / 수정 -->
  <div class="modal" id="modal" hidden>
    <div class="modal-card box">
      <h2 id="modalTitle">새 기록</h2>
      <form id="form" class="compact">
        <input type="hidden" id="fId">
        <input type="hidden" id="fPlanId">
        <div class="field-row">
          <input type="date" id="fDate" aria-label="날짜" required>
          <select id="fCat" aria-label="종류"></select>
        </div>
        <input type="text" id="fTitle" aria-label="제목" placeholder="제목" required>
        <input type="text" id="fPlace" aria-label="장소" placeholder="장소">
        <div class="field-row">
          <input type="url" id="fMap" inputmode="url" aria-label="네이버 지도 링크" placeholder="지도 링크 (비워도 돼요)">
          <a class="btn small" id="btnFindMap" href="https://map.naver.com/" target="_blank" rel="noopener">찾기</a>
        </div>
        <div class="hearts-box" id="fHearts"></div>
        <textarea id="fMemo" rows="2" aria-label="메모" placeholder="메모"></textarea>
        <input type="text" id="fTags" aria-label="태그" placeholder="태그 (쉼표로 구분)">
        <div class="picker" id="fPhotos"></div>
        <div class="modal-btns">
          <button type="button" class="btn" data-close>취소</button>
          <button type="button" class="btn danger" id="btnDelete" hidden>삭제</button>
          <button type="submit" class="btn primary">저장</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 할 거 수정 -->
  <div class="modal" id="planModal" hidden>
    <div class="modal-card box">
      <h2>할 거 고치기</h2>
      <form id="planEditForm">
        <input type="hidden" id="pId">
        <label>종류 <select id="pCat"></select></label>
        <label>하고 싶은 것 <input type="text" id="pTitle" required maxlength="60"></label>
        <label>장소 <input type="text" id="pPlace"></label>
        <div class="field">
          <label for="pMap">네이버 지도 링크</label>
          <div class="field-row">
            <input type="url" id="pMap" inputmode="url" placeholder="비우면 장소 이름으로 검색">
            <a class="btn small" id="btnFindPlanMap" href="https://map.naver.com/" target="_blank" rel="noopener">찾기</a>
          </div>
        </div>
        <div class="modal-btns">
          <button type="button" class="btn" data-close>취소</button>
          <button type="button" class="btn danger" id="btnPlanDelete">삭제</button>
          <button type="submit" class="btn primary">저장</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 일기 쓰기 / 수정 -->
  <div class="modal" id="postModal" hidden>
    <div class="modal-card box">
      <h2 id="postModalTitle">일기 쓰기</h2>
      <form id="postForm">
        <input type="hidden" id="dId">
        <label>날짜 <input type="date" id="dDate" required></label>
        <div class="field">
          <label>쓴 사람</label>
          <div class="who-pick" id="dWho">
            <button type="button" class="chip" data-who="him">석영</button>
            <button type="button" class="chip" data-who="her">예은</button>
          </div>
        </div>
        <label>내용 <textarea id="dText" rows="6" placeholder="오늘 있었던 일"></textarea></label>
        <div class="field">
          <label>사진</label>
          <div class="picker" id="dPhotos"></div>
        </div>
        <div class="modal-btns">
          <button type="button" class="btn" data-close>취소</button>
          <button type="button" class="btn danger" id="btnPostDelete" hidden>삭제</button>
          <button type="submit" class="btn primary">저장</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 처음 한 번: 누구 폰인지 고르기 (한 번 고르면 바꿀 수 없어요) -->
  <div class="modal hello" id="hello" hidden>
    <div class="modal-card box hello-card">
      <div class="hello-step" id="helloWho">
        <h2>안녕! 이 폰은 누구 거야?</h2>
        <p class="hint">한 번 고르면 다시 바꿀 수 없어요</p>
        <div class="hello-pick">
          <button type="button" class="hello-who" data-hello="him"><img class="px" alt="" id="helloHim"><b id="helloHimName">석영</b></button>
          <button type="button" class="hello-who" data-hello="her"><img class="px" alt="" id="helloHer"><b id="helloHerName">예은</b></button>
        </div>
      </div>
      <div class="hello-step" id="helloSure" hidden>
        <h2 id="helloSureText">석영 폰으로 할까요?</h2>
        <p class="hint">이제부터 이 폰은 계속 이 사람으로 기록돼요</p>
        <div class="modal-btns">
          <button type="button" class="btn" id="helloBack">다시 고르기</button>
          <button type="button" class="btn primary" id="helloYes">맞아요</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 앱으로 설치 안내: 웹으로 들어올 때마다 떠요 -->
  <div class="modal" id="installSheet" hidden>
    <div class="modal-card box install-card">
      <img class="install-app" src="icons/icon-192.png" alt="" width="72" height="72">
      <h2>앱으로 깔아서 써요</h2>
      <p class="hint" id="installLead"></p>
      <ol class="install-steps" id="installSteps"></ol>
      <div class="modal-btns">
        <button type="button" class="btn" data-close>나중에</button>
        <button type="button" class="btn primary" id="btnInstallSheet">설치</button>
      </div>
    </div>
  </div>

  <!-- 사진 크게 보기 -->
  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox-close" id="lightboxClose" aria-label="닫기"><span data-icon="close" data-scale="3"></span></button>
    <div class="gallery-track" id="lightboxTrack"></div>
    <span class="gallery-count" id="lightboxCount"></span>
  </div>

  <input type="file" id="filePick" class="file-pick" accept="image/*" multiple tabindex="-1" aria-hidden="true">

  <script src="data/config.js"></script>
  <script src="data/questions.js"></script>
  <script src="js/morph.js"></script>
  <script src="js/pixel.js"></script>
  <script src="js/store.js"></script>
  <script src="js/g/art.js"></script>
  <script src="js/zoo.js"></script>
  <script src="js/items.js"></script>
  <script src="js/moods.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/home.js"></script>
  <script src="js/f/sprites.js"></script>
  <script src="js/cal.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/phones.js"></script>
  <script src="js/notify.js"></script>
  <script src="js/tale.js"></script>
  <script src="js/deco.js"></script>
  <script src="js/charanim.js"></script>
  <script src="js/pals.js"></script>
  <script src="js/play.js"></script>
  <script src="js/plays.js"></script>
  <script src="js/plays2.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/app.js"></script>
  <script src="js/tilt.js"></script>
</body>
</html>
